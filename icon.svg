<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Black background with rounded corners -->
  <rect width="128" height="128" rx="16" ry="16" fill="#000000"/>
  <!-- Cyan border -->
  <rect x="2" y="2" width="124" height="124" rx="14" ry="14" fill="none" stroke="#00ffff" stroke-width="2.5"/>

  <!-- "KI" in white -->
  <text
    x="10"
    y="80"
    font-family="'Courier New', Courier, monospace"
    font-size="58"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="-2">KI</text>

  <!-- "X" in cyan -->
  <text
    x="88"
    y="80"
    font-family="'Courier New', Courier, monospace"
    font-size="58"
    font-weight="bold"
    fill="#00ffff">X</text>

  <!-- Separator line -->
  <line x1="10" y1="88" x2="118" y2="88" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>

  <!-- "MK IV" subtitle -->
  <text
    x="64"
    y="110"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    font-weight="bold"
    fill="#00ffff"
    text-anchor="middle"
    opacity="0.9">MK IV</text>
</svg>
